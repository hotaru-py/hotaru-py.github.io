<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moved to byhotaru.com</title>
    <!-- Tells search engines the site now lives at byhotaru.com -->
    <link rel="canonical" href="https://byhotaru.com/" />
    <meta name="robots" content="noindex" />
    <!-- Fallback when JavaScript is off -->
    <meta http-equiv="refresh" content="0; url=https://byhotaru.com/" />
    <script>
      // Keep the path, query and hash, so links like ?mode=simple carry over
      location.replace(
        "https://byhotaru.com" +
          location.pathname +
          location.search +
          location.hash,
      );
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: #f8f7ed;
        color: #161614;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      a {
        color: inherit;
        font-weight: 700;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161614;
          color: #f8f7ed;
        }
      }
    </style>
  </head>
  <body>
    <p>This site has moved to <a href="https://byhotaru.com/">byhotaru.com</a>.</p>
  </body>
</html>
